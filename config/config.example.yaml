server:
  port: 8080
  host: "0.0.0.0"
  mode: "debug" # debug, release

database:
  driver: "postgres"
  host: "localhost"
  port: 5432
  username: "postgres"
  password: "password"
  dbname: "keydesk"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"

jwt:
  secret: "your-secret-key-here"
  expires_in: "24h"

activation:
  key_length: 16
  key_prefix: "KD"
  default_expiry_days: 365
  max_attempts: 3

logging:
  level: "info" # debug, info, warn, error
  format: "json"
  output: "stdout" 